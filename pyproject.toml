[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "coare"
version = "0.1.0"
description = "COARE – Customer Outreach And Relationship Engine"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
coare = "coare.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["coare*"]
